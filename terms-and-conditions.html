<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms & Conditions | IVANKA RAYKOVA</title>
    <meta name="description" content="Terms & Conditions for ivankaraykova.com.">
    <link rel="canonical" href="https://ivankaraykova.com/terms-and-conditions.html">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js"
        integrity="sha384-fGlgqlm/GUgiVEyV6lvBJbxjprBPT1g0VoE9o/FjCWntEwOQYGqANQdFeFlqbObP" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="styles/legal.css">
</head>

<body>
    <div id="terms-content"></div>

    <script>
        fetch('terms_and_conditions.md')
            .then(response => response.text())
            .then(markdown => {
                document.getElementById('terms-content').innerHTML = marked.parse(markdown);
            })
            .catch(error => {
                console.error('Error loading terms and conditions:', error);
                document.getElementById('terms-content').innerHTML = '<p>Error loading terms and conditions. Please try again later.</p>';
            });
    </script>
</body>

</html>
