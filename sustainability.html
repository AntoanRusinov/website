<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainability | IVANKA RAYKOVA</title>
    <meta name="description" content="Sustainability commitment of IVANKA RAYKOVA — slow, made-to-order, ethical fashion.">
    <link rel="canonical" href="https://ivankaraykova.com/sustainability.html">
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js"
        integrity="sha384-fGlgqlm/GUgiVEyV6lvBJbxjprBPT1g0VoE9o/FjCWntEwOQYGqANQdFeFlqbObP" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="styles/legal.css">
</head>

<body>
    <div id="sustainability-content"></div>
    <script>
        fetch('sustainability.md')
            .then(response => response.text())
            .then(markdown => {
                document.getElementById('sustainability-content').innerHTML = marked.parse(markdown);
            })
            .catch(error => {
                console.error('Error loading sustainability content:', error);
                document.getElementById('sustainability-content').innerHTML = '<p>Error loading sustainability content. Please try again later.</p>';
            });
    </script>
</body>

</html>
